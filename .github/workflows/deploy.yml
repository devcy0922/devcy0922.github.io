name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check current main
        id: freshness
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Current main HEAD confirmed: $GITHUB_SHA"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip stale Pages run ($GITHUB_SHA). Current main is $remote_sha."
          fi

      - name: Setup Node
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.freshness.outputs.publish == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        if: steps.freshness.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.freshness.outputs.publish == 'true'
        run: pnpm docs:build

      - name: Upload artifact
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy
        if: steps.freshness.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
